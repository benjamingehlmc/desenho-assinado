<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <header>
      <span class="selo">Tabuada modular no círculo</span>
      <h1>Desenho Assinado</h1>
      <p>Entre com o Google e escolha um número de 1 a 100. Cada número gera uma figura diferente, assinada com o e-mail da sua conta.</p>
    </header>

    <section class="cartao">
      <div class="passo">
        <span class="num">1</span>
        <div class="conteudo">
          <h2>Entre com o Google</h2>
          <div id="botao-google"></div>
          <p id="status-login"></p>
        </div>
      </div>

      <form id="formulario" class="passo" novalidate>
        <span class="num">2</span>
        <div class="conteudo">
          <h2>Escolha o número</h2>
          <label for="numero">Número (1 a 100)</label>
          <div class="linha">
            <input id="numero" name="numero" type="number" min="1" max="100" step="1" required placeholder="42">
            <button id="enviar" type="submit">Desenhar</button>
          </div>
        </div>
      </form>

      <p id="mensagem" role="alert"></p>

      <figure id="desenho" aria-live="polite"></figure>

      <button id="baixar" type="button" hidden>Baixar SVG</button>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
