<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <h1>Desenho Assinado</h1>
    <p class="sub">Entre com o Google e escolha um número de 1 a 100. O desenho sai assinado com o e-mail da sua conta.</p>

    <section>
      <div id="botao-google"></div>
      <p id="status-login" class="status">Você ainda não entrou.</p>
    </section>

    <form id="formulario" novalidate>
      <label for="numero">Número (1 a 100)</label>
      <input type="number" id="numero" name="numero" inputmode="numeric" placeholder="42">
      <button type="submit">Gerar desenho</button>
    </form>

    <p id="mensagem" role="alert" hidden></p>

    <figure id="resultado" hidden>
      <img id="imagem" alt="Desenho gerado pelo servidor">
      <a id="baixar" download="exemplo.svg">Baixar SVG</a>
    </figure>
  </main>
  <script src="script.js"></script>
</body>
</html>
